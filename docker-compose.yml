services:
  # 后端：钉住上游 xyz commit，构建时 apply backend-patches/ 的 22 条代理端点补丁
  # （含最近收听增量同步 /episode_played_list_for_cache），见 backend.Dockerfile。
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    expose:
      - 23020
    restart: unless-stopped
    networks:
      - xyz-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - xyz-network

networks:
  xyz-network:
    driver: bridge
