server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # 与 dev 环境 Vite 的 `/api` 前缀代理保持同一套规则（见 vite.config.ts）：
    #   /api/discovery -> http://backend:23020/discovery
    # 前端路由 /login、/profile 等不会被后端吞掉（它们不在 /api 下）。
    location /api/ {
        proxy_pass http://backend:23020/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 上游 xyz 会转发 iOS 请求头，别让 nginx 把 Authorization 类头丢掉
        proxy_set_header Authorization $http_authorization;
        proxy_set_header x-jike-access-token $http_x_jike_access_token;
        proxy_set_header x-jike-refresh-token $http_x_jike_refresh_token;
    }

    # 扫码登录：同源代理到小宇宙 web-api（浏览器直连会被 CORS 拦，见 vite.config.ts 同名规则）
    #   /qrcode-api/create -> https://web-api.xiaoyuzhoufm.com/v1/auth/qrcode/create
    #   /qrcode-api/login  -> https://web-api.xiaoyuzhoufm.com/v1/auth/qrcode/login
    location /qrcode-api/ {
        proxy_pass https://web-api.xiaoyuzhoufm.com/v1/auth/qrcode/;
        proxy_http_version 1.1;
        proxy_set_header Host web-api.xiaoyuzhoufm.com;
        proxy_set_header x-midway-app-id v6worU4NnWyL;
        proxy_set_header origin https://accounts.xiaoyuzhoufm.com;
        proxy_set_header referer https://accounts.xiaoyuzhoufm.com/;
        # 上游把 token 放在响应头，必须透传给浏览器
        proxy_pass_request_headers on;
        proxy_ssl_server_name on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
